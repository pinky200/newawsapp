# values.yaml - Complete configuration for your Helm chart

# Application Image Configuration
image:
  repository: ""  # Will be overridden in CI/CD
  tag: ""         # Will be overridden in CI/CD
  pullPolicy: IfNotPresent

# Deployment Configuration
replicaCount: 1

# Resource Configuration (Matches Fargate 0.25vCPU/0.5GB)
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"

# Health Check Configuration
readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  failureThreshold: 30
  periodSeconds: 10

# Container Configuration
container:
  port: 8080  # Must match your application's listening port
  env:
    - name: NODE_ENV
      value: production
    # Add other environment variables here

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080  # Must match container.port
  annotations: {}

# Ingress Configuration (Uncomment if needed)
# ingress:
#   enabled: false
#   className: ""
#   annotations: {}
#   hosts:
#     - host: ""
#       paths:
#         - path: /
#           pathType: ImplementationSpecific
#   tls: []

# Autoscaling Configuration (Uncomment if needed)
# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 3
#   targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80

# Pod Configuration
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Node Selector and Tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# Fargate Specific Configuration (for EKS)
fargateProfile:
  enabled: true
  profileName: fp-default  # Must match your Fargate profile name


# Add this to myapp.client/test/values.yaml
autoscaling:
  enabled: false  # Disable by default
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
