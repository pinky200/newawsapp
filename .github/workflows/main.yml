name: Build, Push, Deploy to EKS (Canada)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: "ca-central-1"
  EKS_CLUSTER_NAME: "mycluster"
  HELM_CHART_NAME: "test"
  ECR_REPOSITORY: "755583968331.dkr.ecr.ca-central-1.amazonaws.com/myapprepo"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Dockerfile location
        id: find-dockerfile
        run: |
          DOCKERFILE_PATH=$(find . -name Dockerfile -printf '%h\n' | head -1)
          echo "DOCKERFILE_DIR=${DOCKERFILE_PATH#./}" >> $GITHUB_ENV
          echo "Found Dockerfile in: ${DOCKERFILE_PATH#./}"

      - name: Find Helm chart location
        id: find-helm-chart
        run: |
          CHART_PATH=$(find . -name Chart.yaml -printf '%h\n' | head -1)
          echo "CHART_DIR=${CHART_PATH#./}" >> $GITHUB_ENV
          echo "Found Helm chart in: ${CHART_PATH#./}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names myapprepo || \
          aws ecr create-repository --repository-name myapprepo

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-push
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd ${{ env.DOCKERFILE_DIR }}
          docker build -t ${{ env.ECR_REPOSITORY }}:$SHORT_SHA .
          docker push ${{ env.ECR_REPOSITORY }}:$SHORT_SHA
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Install Helm and kubectl
        uses: azure/setup-helm@v3

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          # Navigate to chart directory
          cd myapp/myapp.client/test
          
          # Debug output
          echo "Current directory: $(pwd)"
          ls -la
          
          # Install with extended timeout
          helm upgrade --install \
            ${{ env.HELM_CHART_NAME }} \
            . \
            --namespace default \
            --set image.repository=${{ env.ECR_REPOSITORY }} \
            --set image.tag=${{ env.SHORT_SHA }} \
            --atomic \
            --timeout 600s \
            --wait \
            --debug
