name: Build, Push, Deploy to EKS (Canada)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: "ca-central-1"
  EKS_CLUSTER_NAME: "mycluster"
  HELM_CHART_NAME: "test"
  ECR_REPOSITORY: "755583968331.dkr.ecr.ca-central-1.amazonaws.com/myapprepo"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # --- 1. Checkout Code ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 2. Configure AWS for Canada ---
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- 3. Create ECR Repo (if missing) ---
      - name: Ensure ECR Repository
        run: |
          aws ecr describe-repositories --repository-names myapprepo || \
          aws ecr create-repository --repository-name myapprepo

      # --- 4. Login to ECR ---
      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      # --- 5. Build & Push ---
      - name
